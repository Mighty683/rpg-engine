openapi: 3.1.0
info:
  title: RPG Engine API
  version: 0.0.0
  description:
    Browser sessions use the HttpOnly rpg_session cookie. Before a write, obtain a CSRF token from
    GET /api/auth/csrf and send it as x-csrf-token with the cookies returned by that endpoint. Obtain a fresh
    token after login, registration, or logout. Write requests must also satisfy the configured Origin policy.
servers:
  - { url: / }
security:
  - { sessionCookie: [] }
tags:
  - { name: Authentication, description: Browser sessions and CSRF tokens. }
  - { name: Systems, description: Supported role-playing systems. }
  - { name: Games, description: Games accessible to the signed-in account. }
  - { name: Characters, description: "Character sheets, control, and the active party." }
  - { name: NPCs, description: "NPC profiles, visibility, and attacks." }
  - { name: Throws, description: Resolved dice rolls and history. }
  - { name: Memberships, description: Game membership and active character selection. }
  - { name: Invitations, description: "Manage, preview, and accept invitation links." }
  - { name: Events, description: Live game updates. }
paths:
  /api/auth/csrf:
    get:
      operationId: issueCsrfToken
      tags:
        - Authentication
      summary: Issue a CSRF token
      security: []
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
            Set-Cookie:
              description:
                CSRF cookie and, if needed, anonymous identifier cookie. Production uses __Host-rpg_csrf
                and __Host-rpg_csrf_id; development uses rpg_csrf and rpg_csrf_id.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken: { type: string }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/auth/register:
    post:
      operationId: registerAccount
      tags:
        - Authentication
      summary: Register an account
      security:
        - { csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: Created.
          headers:
            Set-Cookie:
              description: The HttpOnly rpg_session cookie. Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/login:
    post:
      operationId: signIn
      tags:
        - Authentication
      summary: Sign in
      security:
        - { csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
      responses:
        "200":
          description: Successful response.
          headers:
            Set-Cookie:
              description: The HttpOnly rpg_session cookie. Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/me:
    get:
      operationId: getCurrentAccount
      tags:
        - Authentication
      summary: Get the signed-in account
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/auth/logout:
    post:
      operationId: signOut
      tags:
        - Authentication
      summary: Sign out
      security:
        - { sessionCookie: [], csrfToken: [] }
      responses:
        "200":
          description: Successful response.
          headers:
            Set-Cookie:
              description: Clears the rpg_session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/rpg-systems:
    get:
      operationId: listSystems
      tags:
        - Systems
      summary: List supported RPG systems
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - systems
                properties:
                  systems:
                    type: array
                    items: { $ref: "#/components/schemas/System" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games:
    get:
      operationId: listGames
      tags:
        - Games
      summary: List accessible games
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - games
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createGame
      tags:
        - Games
      summary: Create a game
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - systemId
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                systemId: { type: string, const: fabula-ultima }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - game
                properties:
                  game: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: getGame
      tags:
        - Games
      summary: Get a game
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - game
                properties:
                  game: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listCharacters
      tags:
        - Characters
      summary: List character summaries
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - characters
                properties:
                  characters:
                    type: array
                    items: { $ref: "#/components/schemas/CharacterSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createCharacter
      tags:
        - Characters
      summary: Create a character
      description: An identical retry returns 200 with the previously created character.
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id: { $ref: "#/components/schemas/Id" }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters/{characterId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/characterId" }
    get:
      operationId: getCharacter
      tags:
        - Characters
      summary: Get a character sheet
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateCharacter
      tags:
        - Characters
      summary: Update a character sheet
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedRevision
                - changes
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                changes: { $ref: "#/components/schemas/CharacterChanges" }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteCharacter
      tags:
        - Characters
      summary: Delete a character
      security:
        - { sessionCookie: [], csrfToken: [] }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters/{characterId}/active:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/characterId" }
    put:
      operationId: setGmCharacterActive
      tags:
        - Characters
      summary: Set a GM character active
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/CharacterSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters/{characterId}/controller:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/characterId" }
    patch:
      operationId: assignCharacter
      tags:
        - Characters
      summary: Assign character control
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - membershipId
              properties:
                membershipId:
                  oneOf:
                    - { $ref: "#/components/schemas/Id" }
                    - { type: "null" }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/CharacterSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/party:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listActiveParty
      tags:
        - Characters
      summary: List active party characters
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - characters
                properties:
                  characters:
                    type: array
                    items: { $ref: "#/components/schemas/PartyCharacter" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/npcs:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listNpcs
      tags:
        - NPCs
      summary: List visible NPCs
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - npcs
                properties:
                  npcs:
                    type: array
                    items: { $ref: "#/components/schemas/Npc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createNpc
      tags:
        - NPCs
      summary: Create an NPC
      description: GM only. An identical retry returns 200 with the previously created NPC.
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - npc
              properties:
                id: { $ref: "#/components/schemas/Id" }
                npc: { $ref: "#/components/schemas/NpcWrite" }
              additionalProperties: false
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - npc
                properties:
                  npc: { $ref: "#/components/schemas/NpcGm" }
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - npc
                properties:
                  npc: { $ref: "#/components/schemas/NpcGm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/npcs/{npcId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/npcId" }
    get:
      operationId: getNpc
      tags:
        - NPCs
      summary: Get an NPC
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - npc
                properties:
                  npc: { $ref: "#/components/schemas/Npc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      operationId: replaceNpc
      tags:
        - NPCs
      summary: Replace an NPC profile
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedRevision
                - npc
              properties:
                expectedRevision: { type: integer, minimum: 0, maximum: 2147483647 }
                npc: { $ref: "#/components/schemas/NpcWrite" }
              additionalProperties: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - npc
                properties:
                  npc: { $ref: "#/components/schemas/NpcGm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteNpc
      tags:
        - NPCs
      summary: Delete an NPC
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedRevision
              properties:
                expectedRevision: { type: integer, minimum: 0, maximum: 2147483647 }
              additionalProperties: false
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/throws:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listThrows
      tags:
        - Throws
      summary: List recent throws
      parameters:
        - name: before
          in: query
          schema: { $ref: "#/components/schemas/Id" }
          description: Exclude this visible throw and newer throws; deleted visible anchors remain usable.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Page size. Values are clamped to 1–100.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - throws
                properties:
                  throws:
                    type: array
                    items: { $ref: "#/components/schemas/Throw" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createThrow
      tags:
        - Throws
      summary: Resolve and record a throw
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThrow" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - throw
                properties:
                  throw: { $ref: "#/components/schemas/Throw" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/throws/{throwId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/throwId" }
    delete:
      operationId: deleteThrow
      tags:
        - Throws
      summary: Delete a throw
      security:
        - { sessionCookie: [], csrfToken: [] }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/members:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listMembers
      tags:
        - Memberships
      summary: List accessible memberships
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - members
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
