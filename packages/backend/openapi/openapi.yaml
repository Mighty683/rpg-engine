        - characterId
        - enabled
        - url
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [game, character] }
        characterId:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        enabled: { type: boolean }
        url: { type: string, format: uri-reference }
    CreateInvitation:
      oneOf:
        - type: object
          required:
            - kind
          properties:
            kind: { type: string, const: game }
        - type: object
          required:
            - kind
            - characterId
          properties:
            kind: { type: string, const: character }
            characterId: { $ref: "#/components/schemas/Id" }
    InvitationPreview:
      oneOf:
        - type: object
          required:
            - kind
            - gameId
            - gameName
            - alreadyMember
          properties:
            kind: { type: string, const: game }
            gameId: { $ref: "#/components/schemas/Id" }
            gameName: { type: string }
            alreadyMember: { type: boolean }
        - type: object
          required:
            - kind
            - gameId
            - gameName
            - alreadyMember
            - characterId
            - characterName
          properties:
            kind: { type: string, const: character }
            gameId: { $ref: "#/components/schemas/Id" }
            gameName: { type: string }
            alreadyMember: { type: boolean }
            characterId: { $ref: "#/components/schemas/Id" }
            characterName: { type: string }
    AcceptedInvitation:
      oneOf:
        - type: object
          required:
            - gameId
          properties:
            gameId: { $ref: "#/components/schemas/Id" }
          additionalProperties: false
        - type: object
          required:
            - gameId
            - characterId
            - active
          properties:
            gameId: { $ref: "#/components/schemas/Id" }
            characterId: { $ref: "#/components/schemas/Id" }
            active: { type: boolean }
          additionalProperties: false
