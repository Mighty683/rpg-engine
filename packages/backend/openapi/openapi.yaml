        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/events:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: subscribeToGameEvents
      tags:
        - Events
      summary: Subscribe to game events
      description:
        The stream sends unnamed SSE frames with JSON payloads. Heartbeat comments are sent every
        15 seconds after the previous authorization check completes. The connection closes when
        the session or game access is revoked, the consumer cannot keep up, or the server shuts down.
        Pending and active streams count toward per-account and global connection limits.
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: no-cache, no-transform
              schema: { type: string }
            X-Accel-Buffering:
              description: "no"
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent event frames with JSON in the data field.
              example: |
                : connected

                data: {"type":"roster"}

              x-event-data-schema:
                oneOf:
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: roster }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                      - characterId
                    properties:
                      type: { type: string, const: sheet }
                      characterId: { $ref: "#/components/schemas/Id" }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: throws }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: npcs }
                    additionalProperties: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Stream capacity reached; rejected before SSE headers with code stream_capacity.
          headers:
            Retry-After:
              description: Seconds before retrying; 15 by default.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The event service is shutting down; code server_stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: rpg_session }
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Use a token issued for the current session or anonymous CSRF cookies.
  parameters:
    gameId:
      name: gameId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    characterId:
      name: characterId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    npcId:
      name: npcId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    throwId:
      name: throwId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    membershipId:
      name: membershipId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    invitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    token:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
  responses:
    BadRequest:
      description: Malformed JSON, invalid identifiers, or an invalid request envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A session is required or credentials were rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The action is forbidden or the Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource unavailable to the current account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The JSON body exceeds 96 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldError" }
    RateLimited:
      description: Too many authentication requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthUnavailable:
      description: The sign-in service is temporarily busy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    FieldError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - fields
          properties:
            code: { type: string, const: validation }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    Account:
      type: object
      required:
        - id
        - username
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
    Registration:
      type: object
      required:
        - username
        - password
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_.-]{3,32}$" }
        password:
          { type: string, format: password, minLength: 8, description: At most 1024 UTF-8 bytes. }
    Login:
      type: object
      required:
        - username
        - password
      properties:
        username: { type: string, maxLength: 128 }
        password: { type: string, format: password, description: At most 1024 UTF-8 bytes. }
    System:
      type: object
      required:
        - id
        - name
      properties:
        id: { type: string, const: fabula-ultima }
        name: { type: string, const: Fabula Ultima }
    Game:
      type: object
      required:
        - id
        - name
        - system
        - createdAt
        - role
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 100 }
        system: { $ref: "#/components/schemas/System" }
        createdAt: { type: string, format: date-time }
        role: { type: string, enum: [GM, Player] }
    Attribute: { type: string, enum: [DEX, INS, MIG, WLP] }
    Die: { type: integer, enum: [6, 8, 10, 12] }
    FreeDie: { type: integer, enum: [4, 6, 8, 10, 12, 20] }
    NamedEntry:
      type: object
      required:
        - id
        - name
        - notes
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 100 }
        notes: { type: string, maxLength: 500 }
      additionalProperties: false
    Equipment:
      oneOf:
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: other }
          additionalProperties: false
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
            - equipped
            - accuracyDice
            - accuracyBonus
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: weapon }
            equipped: { type: boolean }
            accuracyDice:
              type: array
              items:
                oneOf:
                  - { $ref: "#/components/schemas/Attribute" }
                  - { type: "null" }
              minItems: 2
              maxItems: 2
            accuracyBonus:
              oneOf:
                - { type: integer, minimum: -2147483648, maximum: 2147483647 }
                - { type: "null" }
          additionalProperties: false
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
            - equipped
            - fixedDefense
            - defenseBonus
            - magicDefenseBonus
            - initiativeModifier
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: armor }
            equipped: { type: boolean }
            fixedDefense:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            defenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            magicDefenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            initiativeModifier: { type: integer, minimum: -2147483648, maximum: 2147483647 }
          additionalProperties: false
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
            - equipped
            - defenseBonus
            - magicDefenseBonus
            - initiativeModifier
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: shield }
            equipped: { type: boolean }
            defenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            magicDefenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            initiativeModifier: { type: integer, minimum: -2147483648, maximum: 2147483647 }
          additionalProperties: false
    CharacterSummary:
      type: object
      required:
        - id
        - name
        - level
        - controllerMembershipId
        - controllerName
        - canEdit
        - active
        - createdAt
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 100 }
        level: { type: integer, minimum: -2147483648, maximum: 2147483647 }
        controllerMembershipId:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        controllerName:
          oneOf:
            - { type: string }
            - { type: "null" }
        canEdit: { type: boolean }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CharacterSheet:
      type: object
      required:
        - name
        - theme
        - level
        - baseDice
        - classes
        - skills
        - equipment
        - resources
        - overrides
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        theme:
          oneOf:
            - { type: string, maxLength: 200 }
            - { type: "null" }
        level: { type: integer, minimum: 5, maximum: 50 }
        baseDice:
          type: object
          required:
            - DEX
            - INS
            - MIG
            - WLP
          properties:
            DEX: { $ref: "#/components/schemas/Die" }
            INS: { $ref: "#/components/schemas/Die" }
            MIG: { $ref: "#/components/schemas/Die" }
            WLP: { $ref: "#/components/schemas/Die" }
          additionalProperties: false
        classes:
          type: array
          items: { $ref: "#/components/schemas/NamedEntry" }
          maxItems: 2
        skills:
          type: array
          items: { $ref: "#/components/schemas/NamedEntry" }
          maxItems: 100
        equipment:
          type: array
          items: { $ref: "#/components/schemas/Equipment" }
          maxItems: 100
        resources:
          type: object
          required:
            - hp
            - mp
            - ip
            - fabula
          properties:
            hp: { type: integer, minimum: 0, maximum: 2147483647 }
            mp: { type: integer, minimum: 0, maximum: 2147483647 }
            ip: { type: integer, minimum: 0, maximum: 2147483647 }
            fabula: { type: integer, minimum: 0, maximum: 2147483647 }
          additionalProperties: false
        overrides:
          type: object
          required:
            - maxHp
            - maxMp
            - maxIp
            - defense
            - magicDefense
            - initiative
          properties:
            maxHp:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            maxMp:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            maxIp:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            defense:
              oneOf:
                - { type: integer, minimum: -2147483648, maximum: 2147483647 }
                - { type: "null" }
            magicDefense:
              oneOf:
                - { type: integer, minimum: -2147483648, maximum: 2147483647 }
                - { type: "null" }
            initiative:
              oneOf:
                - { type: integer, minimum: -2147483648, maximum: 2147483647 }
                - { type: "null" }
          additionalProperties: false
      additionalProperties: false
    CharacterChanges:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        theme:
