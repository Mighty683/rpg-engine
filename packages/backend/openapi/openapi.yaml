openapi: 3.1.0
info:
  title: RPG Engine API
  version: 0.0.0
  description:
    Browser sessions use the HttpOnly rpg_session cookie. Before a write, obtain a CSRF token from
    GET /api/auth/csrf and send it as x-csrf-token with the cookies returned by that endpoint. Obtain a fresh
    token after login, registration, or logout. Write requests must also satisfy the configured Origin policy.
    Responses include a server-generated X-Request-Id for diagnostics. Game, invitation, and class library mutations share
    a default limit of 60 requests per account per minute across sessions and games. Rejections return 429
    with Retry-After. Database statement and lock deadlines return 503 with code database_busy.
servers:
  - { url: / }
security:
  - { sessionCookie: [] }
tags:
  - { name: Authentication, description: Browser sessions and CSRF tokens. }
  - { name: Systems, description: Supported role-playing systems. }
  - { name: Games, description: Games accessible to the signed-in account. }
  - { name: Characters, description: "Character sheets, control, and the active party." }
  - { name: NPCs, description: "NPC profiles, visibility, and attacks." }
  - { name: Throws, description: Resolved dice rolls and history. }
  - { name: Memberships, description: Game membership and active character selection. }
  - { name: Invitations, description: "Manage, preview, and accept invitation links." }
  - { name: Events, description: Live game updates. }
  - { name: Class catalog, description: Library templates and game-local definitions. }
  - { name: Agent, description: GM game table chat. }
paths:
  /api/games/{gameId}/agent/status:
    parameters:
      - $ref: "#/components/parameters/gameId"
    get:
      operationId: getGameAgentStatus
      summary: Read Agent availability and a page of GM history
      parameters:
        - name: before
          in: query
          description: Exclusive turn ID from this GM transcript. Omit to read the latest page.
          schema: { $ref: "#/components/schemas/Id" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      tags: [Agent]
      description: Requires current GM ownership. A player membership receives 403. Reports deployment enablement without contacting the provider.
      responses:
        "200":
          description: Availability, game-wide busy state and a page of persisted completed turns in chronological order.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /api/games/{gameId}/agent/turns:
    parameters:
      - $ref: "#/components/parameters/gameId"
    post:
      operationId: sendGameAgentTurn
      summary: Ask the Agent about the current game
      tags: [Agent]
      description: >-
        Requires current GM ownership and the application's write Origin check.
        The server builds context using the GM table view, including hidden NPCs, relevant GM notes, public throws and the GM’s own private throws. Completed turns are persisted and
        return text, tool summaries, and optionally a proposal for user review.
        The proposal is input to the existing game workflow and grants no authority.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTurnInput" }
            examples:
              weaponAttack:
                value: { message: Robert attacks Agile with hammer }
              agilityCheck:
                value: { message: Christine make check roll for agility when tumbling }
              freeRoll:
                value: { message: Make 2x10d roll }
              askAboutParty:
                summary: Ask who is at the table
                value:
                  message: Who is in the party?
      responses:
        "200":
          description: Completed turn.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another turn is active in this game (agent_game_busy), or visibility narrowed during the turn (agent_context_changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Account rate limit or Agent concurrency limit. Code rate_limited or agent_busy.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502":
          description: Invalid provider response or exhausted tool-call budget. Code agent_failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Agent disabled, provider temporarily unavailable, or database busy. Code agent_disabled, agent_unavailable, or database_busy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Turn deadline exceeded. Code agent_timeout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/library/class:
    get:
      operationId: listClassTemplates
      tags:
        - Class catalog
      summary: List class templates
      description: Read the authenticated account’s private Fabula Ultima library.
      responses:
        "200":
          description: Account-owned templates.
          content:
            application/json:
              schema:
                type: object
                required:
                  - templates
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      operationId: createClassTemplate
      tags:
        - Class catalog
      summary: Create a class template
      description: Create in the authenticated account’s private library. An identical create retry
        returns 200. A reused ID with different intent returns 409 id_conflict.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
      responses:
        "200":
          $ref: "#/components/responses/Template"
        "201":
          $ref: "#/components/responses/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/library/class/{templateId}:
    parameters:
      - $ref: "#/components/parameters/templateId"
    patch:
      operationId: updateClassTemplate
      tags:
        - Class catalog
      summary: Replace a template definition
      description: Update only a template owned by the caller. Returns 409 stale_revision when the
        revision differs.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplate"
      responses:
        "200":
          $ref: "#/components/responses/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/games/{gameId}/classes:
    parameters:
      - $ref: "#/components/parameters/gameId"
    get:
      operationId: listGameClasses
      tags:
        - Class catalog
      summary: List game classes
      description: The GM and active game members may read the Fabula Ultima game catalog.
      responses:
        "200":
          description: Game-local class definitions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - classes
                properties:
                  classes:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredClass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      operationId: copyClassToGame
      tags:
        - Class catalog
      summary: Copy a library template into a game
      description:
        GM only. Copy an account-owned template of the same system at the expected revision.
        Use a new ID for another copy. An identical retry returns 200.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyClass"
      responses:
        "200":
          $ref: "#/components/responses/GameClass"
        "201":
          $ref: "#/components/responses/GameClass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/games/{gameId}/classes/{gameClassId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/gameClassId" }
    patch:
      operationId: updateGameClass
      tags: [Class catalog]
      summary: Replace a game class definition
      description:
        GM only. Keep IDs of retained skills. If learned skills would be removed, return their current
        impact. A retry with matching confirmation commits the definition and removes those ranks together.
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGameClass" }
      responses:
        "200": { $ref: "#/components/responses/GameClass" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GameClassUpdateConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteGameClass
      tags: [Class catalog]
      summary: Remove a game class
      description: GM only. A class with assigned levels cannot be removed.
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteGameClass" }
      responses:
        "204": { description: Game class removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GameClassDeleteConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/classes/{gameClassId}/save-to-library:
    parameters:
      - $ref: "#/components/parameters/gameId"
      - $ref: "#/components/parameters/gameClassId"
    post:
      operationId: saveGameClassToLibrary
      tags:
        - Class catalog
      summary: Save a game class to the library
      description:
        GM only. Snapshot the current game definition into the caller’s library. Returns 201
        for a new template and 200 for an update or matching create retry. The game class and its
        assignments remain in place.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveClassToLibrary"
      responses:
        "200":
          $ref: "#/components/responses/Template"
        "201":
          $ref: "#/components/responses/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/auth/csrf:
    get:
      operationId: issueCsrfToken
      tags:
        - Authentication
      summary: Issue a CSRF token
      security: []
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
            Set-Cookie:
              description:
                CSRF cookie and, if needed, anonymous identifier cookie. Production uses __Host-rpg_csrf
                and __Host-rpg_csrf_id; development uses rpg_csrf and rpg_csrf_id.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken: { type: string }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/auth/register:
    post:
      operationId: registerAccount
      tags:
        - Authentication
      summary: Register an account
      security:
        - { csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: Created.
          headers:
            Set-Cookie:
              description: The HttpOnly rpg_session cookie. Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/login:
    post:
      operationId: signIn
      tags:
        - Authentication
      summary: Sign in
      security:
        - { csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
      responses:
        "200":
          description: Successful response.
          headers:
            Set-Cookie:
              description: The HttpOnly rpg_session cookie. Secure in production.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/me:
    get:
      operationId: getCurrentAccount
      tags:
        - Authentication
      summary: Get the signed-in account
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/auth/logout:
    post:
      operationId: signOut
      tags:
        - Authentication
      summary: Sign out
      security:
        - { sessionCookie: [], csrfToken: [] }
      responses:
        "200":
          description: Successful response.
          headers:
            Set-Cookie:
              description: Clears the rpg_session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/rpg-systems:
    get:
      operationId: listSystems
      tags:
        - Systems
      summary: List supported RPG systems
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - systems
                properties:
                  systems:
                    type: array
                    items: { $ref: "#/components/schemas/System" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games:
    get:
      operationId: listGames
      tags:
        - Games
      summary: List accessible games
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - games
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createGame
      tags:
        - Games
      summary: Create a game
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - systemId
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                systemId: { type: string, const: fabula-ultima }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - game
                properties:
                  game: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: getGame
      tags:
        - Games
      summary: Get a game
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - game
                properties:
                  game: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: listCharacters
      tags:
        - Characters
      summary: List character summaries
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - characters
                properties:
                  characters:
                    type: array
                    items: { $ref: "#/components/schemas/CharacterSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createCharacter
      tags:
        - Characters
      summary: Create a character
      description: An identical retry returns 200 with the previously created character.
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id: { $ref: "#/components/schemas/Id" }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/characters/{characterId}:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
      - { $ref: "#/components/parameters/characterId" }
    get:
      operationId: getCharacter
      tags:
        - Characters
      summary: Get a character sheet
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - character
                properties:
                  character: { $ref: "#/components/schemas/Character" }
