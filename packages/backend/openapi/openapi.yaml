  /api/invitations/{token}:
    parameters:
      - { $ref: "#/components/parameters/token" }
    get:
      operationId: previewInvitation
      tags:
        - Invitations
      summary: Preview an invitation
      responses:
        "200":
          description: Successful response.
          headers:
            Referrer-Policy:
              description: no-referrer
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required:
                  - invitation
                properties:
                  invitation: { $ref: "#/components/schemas/InvitationPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/invitations/{token}/accept:
    parameters:
      - { $ref: "#/components/parameters/token" }
    post:
      operationId: acceptInvitation
      tags:
        - Invitations
      summary: Accept an invitation
      security:
        - { sessionCookie: [], csrfToken: [] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                makeActive: { type: boolean, default: true }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/games/{gameId}/events:
    parameters:
      - { $ref: "#/components/parameters/gameId" }
    get:
      operationId: subscribeToGameEvents
      tags:
        - Events
      summary: Subscribe to game events
      description:
        The stream sends unnamed SSE frames with JSON payloads. Heartbeat comments are sent every
        15 seconds after the previous authorization check completes. The connection closes when
        the session or game access is revoked, the consumer cannot keep up, or the server shuts down.
        Pending and active streams count toward per-account and global connection limits.
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: no-cache, no-transform
              schema: { type: string }
            X-Accel-Buffering:
              description: "no"
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent event frames with JSON in the data field.
              example: |
                : connected

                data: {"type":"roster"}

              x-event-data-schema:
                oneOf:
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: roster }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                      - characterId
                    properties:
                      type: { type: string, const: sheet }
                      characterId: { $ref: "#/components/schemas/Id" }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: throws }
                    additionalProperties: false
                  - type: object
                    required:
                      - type
                    properties:
                      type: { type: string, const: npcs }
                    additionalProperties: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Stream capacity reached; rejected before SSE headers with code stream_capacity.
          headers:
            Retry-After:
              description: Seconds before retrying; 15 by default.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The event service is shutting down or the database is busy; code server_stopping or database_busy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: rpg_session }
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Use a token issued for the current session or anonymous CSRF cookies.
  parameters:
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    gameClassId:
      name: gameClassId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    gameId:
      name: gameId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    characterId:
      name: characterId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    npcId:
      name: npcId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    throwId:
      name: throwId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    membershipId:
      name: membershipId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    invitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    token:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
  responses:
    GameClassUpdateConflict:
      description: Stale revision, or confirmation required for the current skill-removal impact.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                oneOf:
                  - type: object
                    required: [code, message]
                    properties:
                      code: { type: string, const: stale_revision }
                      message: { type: string }
                  - type: object
                    required: [code, message, impact]
                    properties:
                      code: { type: string, const: skill_removal_confirmation_required }
                      message: { type: string }
                      impact: { $ref: "#/components/schemas/SkillRemovalImpact" }
    GameClassDeleteConflict:
      description: Stale revision or class assigned to a character.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [stale_revision, class_in_use]
                  message: { type: string }
    Template:
      description: Saved library template.
      content:
        application/json:
          schema:
            type: object
            required:
              - template
            properties:
              template:
                $ref: "#/components/schemas/ClassTemplate"
    GameClass:
      description: Saved game class.
      content:
        application/json:
          schema:
            type: object
            required:
              - gameClass
            properties:
              gameClass:
                $ref: "#/components/schemas/StoredClass"
    BadRequest:
      description: Malformed JSON, invalid identifiers, or an invalid request envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A session is required or credentials were rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The action is forbidden or the Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource unavailable to the current account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The JSON body exceeds 96 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldError" }
    RateLimited:
      description: Too many authentication requests or authenticated mutations; code rate_limited.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: A database statement or lock deadline was exceeded; code database_busy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthUnavailable:
      description: The sign-in service or database is temporarily busy; code auth_busy or database_busy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  headers:
    NoStore:
      schema: { type: string, const: no-store }
  schemas:
    AgentStatus:
      type: object
      required: [available, busy, turns, nextBefore]
      properties:
        available: { type: boolean }
        busy: { type: boolean }
        nextBefore:
          description: Exclusive cursor for the next older page, or null at the beginning of history.
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        turns:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, author, message, tools, reply]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              author: { type: string, description: Display name of the sender. }
              message: { $ref: "#/components/schemas/AgentMessage" }
              tools:
                type: array
                maxItems: 10
                items: { $ref: "#/components/schemas/AgentToolSummary" }
              reply: { type: string, minLength: 1, maxLength: 6000 }
              roll:
                type: object
                required: [characterName, equipmentName, private, outcome]
                properties:
                  characterName: { type: string }
                  equipmentName: { type: [string, "null"] }
                  private: { type: boolean }
                  outcome: { $ref: "#/components/schemas/ThrowOutcome" }
            additionalProperties: false
      additionalProperties: false
    AgentMessage:
      type: string
      minLength: 1
      maxLength: 2000
      description: User text. The server trims it and rejects whitespace-only input.
    AgentTurnInput:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/AgentMessage" }
      additionalProperties: false
    AgentToolSummary:
      type: object
      required: [tool, label]
      properties:
        tool:
          {
            type: string,
            enum:
              [
                read_character,
                read_npc,
                read_throws,
                prepare_throw,
                prepare_character_edit,
                prepare_npc_edit,
              ],
          }
        label: { type: string, minLength: 1, maxLength: 160 }
      additionalProperties: false
    AgentTurn:
      type: object
      required: [id, reply, tools]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        reply: { type: string, minLength: 1, maxLength: 6000 }
        tools:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AgentToolSummary" }
          description: Server-authored summaries of completed reads and prepared actions, in execution order.
        action:
          oneOf:
            - $ref: "#/components/schemas/RollProposal"
            - $ref: "#/components/schemas/CharacterEditProposal"
            - $ref: "#/components/schemas/NpcEditProposal"
      additionalProperties: false
    RollProposal:
      type: object
      required: [kind, input]
      properties:
        kind: { type: string, const: roll }
        targetLabel:
          type: string
          maxLength: 100
          description: GM-only target display name shown in review. Never copy it into the throw payload.
        input:
          $ref: "#/components/schemas/CreateThrow"
          description: Reviewed setup. sourceThrowId identifies a visible reroll target when supplied.
      additionalProperties: false
    CharacterEditProposal:
      type: object
      required: [kind, characterId, expectedRevision, changes]
      properties:
        kind: { type: string, const: edit_character }
        characterId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        changes:
          type: object
          minProperties: 1
          allOf:
            - $ref: "#/components/schemas/CharacterChanges"
          propertyNames:
            enum: [name, theme, level, baseDice, resources]
      additionalProperties: false
    NpcEditProposal:
      type: object
      required: [kind, npcId, expectedRevision, changes]
      properties:
        kind: { type: string, const: edit_npc }
        npcId: { $ref: "#/components/schemas/Id" }
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        changes:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            name: { $ref: "#/components/schemas/NpcWrite/properties/name" }
            relationship: { $ref: "#/components/schemas/NpcWrite/properties/relationship" }
            level: { $ref: "#/components/schemas/NpcWrite/properties/level" }
            baseDice: { $ref: "#/components/schemas/NpcWrite/properties/baseDice" }
            hp: { $ref: "#/components/schemas/NpcWrite/properties/hp" }
            mp: { $ref: "#/components/schemas/NpcWrite/properties/mp" }
            defense: { $ref: "#/components/schemas/NpcWrite/properties/defense" }
            magicDefense: { $ref: "#/components/schemas/NpcWrite/properties/magicDefense" }
            notes: { $ref: "#/components/schemas/NpcWrite/properties/notes" }
      additionalProperties: false
    NonnegativeInt:
      type: integer
      minimum: 0
      maximum: 2147483647
    Name:
      type: string
      minLength: 1
      maxLength: 100
    Revision:
      $ref: "#/components/schemas/NonnegativeInt"
    FabulaSystem:
      type: string
      const: fabula-ultima
    ModifierStat:
      type: string
      enum:
        - maxHp
        - maxMp
        - maxIp
        - defense
        - magicDefense
        - dieDex
        - dieIns
        - dieMig
        - dieWlp
    Benefit:
      oneOf:
        - type: object
          required:
            - id
            - kind
            - name
            - description
          properties:
            id:
              $ref: "#/components/schemas/Id"
            kind:
              type: string
              const: text
            name:
              $ref: "#/components/schemas/Name"
            description:
              type: string
              minLength: 1
              maxLength: 2000
          additionalProperties: false
        - type: object
          required:
            - id
            - kind
            - name
            - stat
            - amount
          properties:
            id:
              $ref: "#/components/schemas/Id"
            kind:
              type: string
              const: modifier
            name:
              $ref: "#/components/schemas/Name"
            description:
              type: string
              maxLength: 2000
            stat:
              $ref: "#/components/schemas/ModifierStat"
            amount:
              type: integer
              minimum: -2147483648
              maximum: 2147483647
            perRank:
              type: boolean
              default: false
          additionalProperties: false
      description: Rank scaling applies only to skill benefits. Free benefits are applied once.
    ClassSkill:
      type: object
      required:
        - id
        - name
        - description
        - maxRank
        - benefits
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 2000
        maxRank:
          type: integer
          minimum: 1
          maximum: 2147483647
        benefits:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Benefit"
      additionalProperties: false
    ClassDefinition:
      type: object
      required:
        - name
        - description
        - freeBenefits
        - skills
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 2000
        freeBenefits:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Benefit"
        skills:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ClassSkill"
      additionalProperties: false
      description: List order is preserved. Reject duplicate skill or benefit IDs within the definition.
    StoredClass:
      type: object
      required:
        - id
        - revision
        - systemId
        - definition
      properties:
        id:
          $ref: "#/components/schemas/Id"
        revision:
          $ref: "#/components/schemas/Revision"
        systemId:
          $ref: "#/components/schemas/FabulaSystem"
        definition:
          $ref: "#/components/schemas/ClassDefinition"
      additionalProperties: false
    ClassTemplate:
      $ref: "#/components/schemas/StoredClass"
    CreateTemplate:
      type: object
      required:
        - id
        - systemId
        - definition
      properties:
        id:
          $ref: "#/components/schemas/Id"
        systemId:
          $ref: "#/components/schemas/FabulaSystem"
        definition:
          $ref: "#/components/schemas/ClassDefinition"
      additionalProperties: false
    UpdateTemplate:
      type: object
      required:
        - expectedRevision
        - definition
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        definition:
          $ref: "#/components/schemas/ClassDefinition"
      additionalProperties: false
    CopyClass:
      type: object
      required:
        - id
        - templateId
        - expectedTemplateRevision
      properties:
        id:
          $ref: "#/components/schemas/Id"
        templateId:
          $ref: "#/components/schemas/Id"
        expectedTemplateRevision:
          $ref: "#/components/schemas/Revision"
      additionalProperties: false
    UpdateGameClass:
      type: object
      required: [expectedRevision, definition]
      properties:
        expectedRevision: { $ref: "#/components/schemas/Revision" }
        definition: { $ref: "#/components/schemas/ClassDefinition" }
        confirmedSkillRemovals: { $ref: "#/components/schemas/SkillRemovalImpact" }
      additionalProperties: false
    SkillRemovalImpact:
      type: array
      maxItems: 30
      items:
        type: object
        required: [skillId, characters]
        properties:
          skillId: { $ref: "#/components/schemas/Id" }
          characters:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, name, rank]
              properties:
                id: { $ref: "#/components/schemas/Id" }
                name: { $ref: "#/components/schemas/Name" }
                rank: { type: integer, minimum: 1, maximum: 10 }
              additionalProperties: false
        additionalProperties: false
    DeleteGameClass:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: "#/components/schemas/Revision" }
      additionalProperties: false
    SaveClassToLibrary:
      type: object
      required:
        - expectedRevision
        - target
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        target:
          oneOf:
            - type: object
              required:
                - mode
                - id
                - name
              properties:
                mode:
                  type: string
                  const: new
                id:
                  $ref: "#/components/schemas/Id"
                name:
                  $ref: "#/components/schemas/Name"
              additionalProperties: false
            - type: object
              required:
                - mode
                - templateId
                - expectedTemplateRevision
              properties:
                mode:
                  type: string
                  const: update
                templateId:
                  $ref: "#/components/schemas/Id"
                expectedTemplateRevision:
                  $ref: "#/components/schemas/Revision"
              additionalProperties: false
      additionalProperties: false
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    FieldError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - fields
          properties:
            code: { type: string, const: validation }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    Account:
      type: object
      required:
        - id
        - username
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
    Registration:
      type: object
      required:
        - username
        - password
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_.-]{3,32}$" }
        password:
          {
            type: string,
            format: password,
            description: At least 8 UTF-16 code units and at most 1024 UTF-8 bytes.,
          }
    Login:
      type: object
      required:
        - username
        - password
      properties:
        username: { type: string, maxLength: 128 }
        password: { type: string, format: password, description: At most 1024 UTF-8 bytes. }
    System:
      type: object
      required:
        - id
        - name
      properties:
        id: { type: string, const: fabula-ultima }
        name: { type: string, const: Fabula Ultima }
    Game:
      type: object
      required:
        - id
        - name
        - system
        - createdAt
        - role
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 100 }
        system: { $ref: "#/components/schemas/System" }
        createdAt: { type: string, format: date-time }
        role: { type: string, enum: [GM, Player] }
    Attribute: { type: string, enum: [DEX, INS, MIG, WLP] }
    Die: { type: integer, enum: [6, 8, 10, 12] }
    FreeDie: { type: integer, enum: [4, 6, 8, 10, 12, 20] }
    NamedEntry:
      type: object
      required:
        - id
        - name
        - notes
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 100 }
        notes: { type: string, maxLength: 500 }
      additionalProperties: false
    Equipment:
      oneOf:
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: other }
          additionalProperties: false
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
            - equipped
            - accuracyDice
            - accuracyBonus
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: weapon }
            equipped: { type: boolean }
            accuracyDice:
              type: array
              items:
                oneOf:
                  - { $ref: "#/components/schemas/Attribute" }
                  - { type: "null" }
              minItems: 2
              maxItems: 2
            accuracyBonus:
              oneOf:
                - { type: integer, minimum: -2147483648, maximum: 2147483647 }
                - { type: "null" }
          additionalProperties: false
        - type: object
          required:
            - id
            - name
            - notes
            - priceZenit
            - kind
            - equipped
            - fixedDefense
            - defenseBonus
            - magicDefenseBonus
            - initiativeModifier
          properties:
            id: { $ref: "#/components/schemas/Id" }
            name: { type: string, minLength: 1, maxLength: 100 }
            notes: { type: string, maxLength: 500 }
            priceZenit:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            kind: { type: string, const: armor }
            equipped: { type: boolean }
            fixedDefense:
              oneOf:
                - { type: integer, minimum: 0, maximum: 2147483647 }
                - { type: "null" }
            defenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            magicDefenseBonus: { type: integer, minimum: -2147483648, maximum: 2147483647 }
            initiativeModifier: { type: integer, minimum: -2147483648, maximum: 2147483647 }
          additionalProperties: false
