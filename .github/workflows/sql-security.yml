name: SQL security check
on:
  push:
  pull_request:
jobs:
  static-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vp test lint/sql-security.test.js
  api-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rpg_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpg_test -d rpg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rpg_test:local_test_only@127.0.0.1:5432/rpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rpg-engine/tests test:api
      - run: pnpm exec vp test packages/backend/src/app.security.test.ts packages/backend/src/modules/auth/sessions.integration.test.ts packages/backend/src/modules/auth/hash-capacity.test.ts packages/backend/src/modules/auth/csrf.test.ts packages/frontend/src/shared/secure-fetch.test.ts
