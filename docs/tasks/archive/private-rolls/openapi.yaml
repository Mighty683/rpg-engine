openapi: 3.1.0
info:
  title: Private rolls — proposed API changes
  version: 1.0.0
  description: Review contract for affected throw operations. Replaces the sequence cursor with a throw ID and removes
    seq from responses.
security:
- sessionCookie: []
paths:
  /api/games/{gameId}/throws:
    parameters:
    - $ref: '#/components/parameters/gameId'
    get:
      operationId: listThrows
      tags:
      - Throws
      summary: List recent throws
      parameters:
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: ID of a previously visible throw; returns visible throws older than this anchor. Deleted anchors
          remain usable. Unknown or inaccessible anchors return 404.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Page size. Values are clamped to 1–100.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - throws
                properties:
                  throws:
                    type: array
                    items:
                      $ref: '#/components/schemas/Throw'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Lists public throws and throws authored by the current account, filtering before pagination.
        Ordered oldest to newest within each page. Private throws of other accounts are not disclosed.
    post:
      operationId: createThrow
      tags:
      - Throws
      summary: Resolve and record a throw
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThrow'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                - throw
                properties:
                  throw:
                    $ref: '#/components/schemas/Throw'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Private throws are visible only to the authenticated author. An inaccessible source throw returns
        404. Existing role and setup permissions apply.
  /api/games/{gameId}/throws/{throwId}:
    parameters:
    - $ref: '#/components/parameters/gameId'
    - $ref: '#/components/parameters/throwId'
    delete:
      operationId: deleteThrow
      tags:
      - Throws
      summary: Delete a throw
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                properties:
                  deleted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: A private throw belonging to another account returns 404, including for the GM. Existing author
        or GM removal permissions apply to visible throws.
components:
  parameters:
    throwId:
      name: throwId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    gameId:
      name: gameId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    FieldError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          properties:
            code:
              type: string
              const: validation
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Throw:
      type: object
      required:
      - id
      - createdAt
      - kind
      - role
      - characterId
      - characterName
      - equipmentId
      - equipmentName
      - setup
      - outcome
      - canRemove
      - private
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/ThrowKind'
        role:
          type: string
          enum:
          - GM
          - Player
        characterId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        characterName:
          type: string
        equipmentId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        equipmentName:
          oneOf:
          - type: string
          - type: 'null'
        setup:
          oneOf:
          - $ref: '#/components/schemas/ResolvedCharacterThrow'
          - $ref: '#/components/schemas/ResolvedNpcThrow'
        outcome:
          $ref: '#/components/schemas/ThrowOutcome'
        canRemove:
          type: boolean
        private:
          type: boolean
          description: True only for an author-only throw.
    ResolvedNpcThrow:
      type: object
      required:
      - type
      - npcId
      - npcName
      - attributes
      - kind
      - dice
      - modifier
      - note
      - redDice
      - redModifier
      - attack
      properties:
        type:
          type: string
          enum:
          - npc-attribute
          - npc-attack
        npcId:
          $ref: '#/components/schemas/Id'
        npcName:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
          minItems: 1
          maxItems: 2
        kind:
          $ref: '#/components/schemas/ThrowKind'
        dice:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedDie'
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
        redDice:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedDie'
        redModifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        attack:
          oneOf:
          - type: object
            required:
            - id
            - name
            - accuracyBonus
            - damageBonus
            - damageType
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              accuracyBonus:
                type: integer
                minimum: -2147483648
                maximum: 2147483647
              damageBonus:
                type: integer
                minimum: -2147483648
                maximum: 2147483647
              damageType:
                type: string
          - type: 'null'
    ResolvedDie:
      type: object
      required:
      - label
      - size
      properties:
        label:
          oneOf:
          - type: string
          - type: 'null'
        size:
          $ref: '#/components/schemas/FreeDie'
    FreeDie:
      type: integer
      enum:
      - 4
      - 6
      - 8
      - 10
      - 12
      - 20
    ThrowKind:
      type: string
      enum:
      - attribute-check
      - attribute-roll
      - weapon-accuracy
      - free
      - opposed-check
      - opposed-roll
    Attribute:
      type: string
      enum:
      - DEX
      - INS
      - MIG
      - WLP
    ResolvedCharacterThrow:
      type: object
      required:
      - type
      - characterId
      - equipmentId
      - kind
      - dice
      - modifier
      - note
      - redDice
      - redModifier
      - weaponBonus
      - accuracyDice
      properties:
        type:
          type: string
          enum:
          - attribute
          - weapon
          - free
        characterId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        npcId:
          $ref: '#/components/schemas/Id'
        equipmentId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        kind:
          $ref: '#/components/schemas/ThrowKind'
        dice:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedDie'
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
        redDice:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedDie'
        redModifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        weaponBonus:
          oneOf:
          - type: integer
            minimum: -2147483648
            maximum: 2147483647
          - type: 'null'
        accuracyDice:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/Attribute'
            minItems: 2
            maxItems: 2
          - type: 'null'
    ThrowOutcome:
      type: object
      required:
      - first
      properties:
        first:
          $ref: '#/components/schemas/ThrowSide'
        second:
          $ref: '#/components/schemas/ThrowSide'
        winner:
          type: string
          enum:
          - first
          - second
          - tie
    ThrowSide:
      type: object
      required:
      - dice
      - modifier
      - total
      - result
      properties:
        dice:
          type: array
          items:
            type: object
            required:
            - label
            - size
            - face
            properties:
              label:
                oneOf:
                - type: string
                - type: 'null'
              size:
                $ref: '#/components/schemas/FreeDie'
              face:
                type: integer
                minimum: 1
        modifier:
          type: integer
        total:
          type: integer
        result:
          type: string
          enum:
          - fumble
          - critical
          - ordinary
          - none
    CreateThrow:
      type: object
      required:
      - setup
      properties:
        sourceThrowId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        setup:
          oneOf:
          - $ref: '#/components/schemas/AttributeThrowSetup'
          - $ref: '#/components/schemas/WeaponThrowSetup'
          - $ref: '#/components/schemas/FreeThrowSetup'
          - $ref: '#/components/schemas/NpcAttributeThrowSetup'
          - $ref: '#/components/schemas/NpcAttackThrowSetup'
        private:
          type: boolean
          default: false
          description: If true, visible only to the authenticated author; omitted means public.
      additionalProperties: false
    NpcAttackThrowSetup:
      type: object
      required:
      - type
      - npcId
      - attackId
      - expectedRevision
      - dice
      - modifier
      - note
      properties:
        type:
          type: string
          const: npc-attack
        npcId:
          $ref: '#/components/schemas/Id'
        attackId:
          $ref: '#/components/schemas/Id'
        expectedRevision:
          type: integer
          minimum: 0
        dice:
          type: array
          items:
            $ref: '#/components/schemas/Die'
          minItems: 2
          maxItems: 2
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
      additionalProperties: false
    Die:
      type: integer
      enum:
      - 6
      - 8
      - 10
      - 12
    NpcAttributeThrowSetup:
      type: object
      required:
      - type
      - npcId
      - expectedRevision
      - attributes
      - dice
      - modifier
      - note
      - redDice
      - redModifier
      properties:
        type:
          type: string
          const: npc-attribute
        npcId:
          $ref: '#/components/schemas/Id'
        expectedRevision:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
          minItems: 1
          maxItems: 2
        dice:
          type: object
          properties:
            DEX:
              $ref: '#/components/schemas/Die'
            INS:
              $ref: '#/components/schemas/Die'
            MIG:
              $ref: '#/components/schemas/Die'
            WLP:
              $ref: '#/components/schemas/Die'
          additionalProperties: false
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
        redDice:
          type: array
          items:
            $ref: '#/components/schemas/Die'
          minItems: 0
          maxItems: 2
        redModifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
      additionalProperties: false
    FreeThrowSetup:
      type: object
      required:
      - type
      - characterId
      - dice
      - modifier
      - note
      - redDice
      - redModifier
      properties:
        type:
          type: string
          const: free
        characterId:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: string
            const: gm
          description: Character ID, NPC ID for a GM, or gm.
        dice:
          type: array
          items:
            $ref: '#/components/schemas/FreeDie'
          minItems: 1
          maxItems: 2
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
        redDice:
          type: array
          items:
            $ref: '#/components/schemas/FreeDie'
          minItems: 0
          maxItems: 2
        redModifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
      additionalProperties: false
    WeaponThrowSetup:
      type: object
      required:
      - type
      - characterId
      - equipmentId
      - expectedRevision
      - dice
      - modifier
      - note
      properties:
        type:
          type: string
          const: weapon
        characterId:
          $ref: '#/components/schemas/Id'
        equipmentId:
          $ref: '#/components/schemas/Id'
        expectedRevision:
          type: integer
          minimum: 0
        dice:
          type: array
          items:
            $ref: '#/components/schemas/Die'
          minItems: 2
          maxItems: 2
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
      additionalProperties: false
    AttributeThrowSetup:
      type: object
      required:
      - type
      - characterId
      - expectedRevision
      - attributes
      - dice
      - modifier
      - note
      - redDice
      - redModifier
      properties:
        type:
          type: string
          const: attribute
        characterId:
          $ref: '#/components/schemas/Id'
        expectedRevision:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
          minItems: 1
          maxItems: 2
        dice:
          type: object
          properties:
            DEX:
              $ref: '#/components/schemas/Die'
            INS:
              $ref: '#/components/schemas/Die'
            MIG:
              $ref: '#/components/schemas/Die'
            WLP:
              $ref: '#/components/schemas/Die'
          additionalProperties: false
        modifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        note:
          type: string
          maxLength: 500
        redDice:
          type: array
          items:
            $ref: '#/components/schemas/Die'
          minItems: 0
          maxItems: 2
        redModifier:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
      additionalProperties: false
  responses:
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource unavailable to the current account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The action is forbidden or the Origin or CSRF check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: A session is required or credentials were rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Malformed JSON, invalid identifiers, or an invalid request envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldError'
    PayloadTooLarge:
      description: The JSON body exceeds 96 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rpg_session
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Use a token issued for the current session or anonymous CSRF cookies.
servers:
- url: /
  description: Same-origin API
